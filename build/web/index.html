<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pasar Interaktif</title>
  <link rel="preload" href="assets/fonts/press_start_2p.ttf" as="font" type="font/ttf">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #stage {
      aspect-ratio: 16 / 9;
      width: min(100vw, calc(100vh * 16 / 9));
    }
    #screen {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: none;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="screen"></canvas>
  </div>
  <script src="config.js"></script>
  <script src="main.js"></script>
</body>
</html>
